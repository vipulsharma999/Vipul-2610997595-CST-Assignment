<!DOCTYPE html>
<html>
<head>
    <title>Online Course Registration</title>
</head>
<body>

    <h2>Online Course Registration</h2>

    <form action="submit.html" target="_blank" method="post" enctype="multipart/form-data">

        <input type="hidden" name="form_type" value="Online Course Registration">

        <label for="name">Student Name:</label><br>
        <input type="text" id="name" name="student_name" placeholder="Enter your full name" required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="example@email.com" required><br><br>

        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile" placeholder="10-digit number" required><br><br>

        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" min="1" max="100" placeholder="Enter age"><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" placeholder="Enter password" required><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label><br><br>

        <label for="course">Select Course:</label><br>
        <select id="course" name="course" required>
            <option value="">-- Choose a Course --</option>
            <option value="Web Development">Web Development</option>
            <option value="Python Programming">Python Programming</option>
            <option value="Data Analytics">Data Analytics</option>
            <option value="Digital Marketing">Digital Marketing</option>
        </select><br><br>

        <label for="classtime">Preferred Class Time:</label><br>
        <input type="time" id="classtime" name="class_time"><br><br>

        <label>Skills:</label><br>
        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>
        <input type="checkbox" id="js" name="skills" value="JavaScript">
        <label for="js">JavaScript</label>
        <input type="checkbox" id="python" name="skills" value="Python">
        <label for="python">Python</label><br><br>

        <label for="document">Upload Document / Photograph:</label><br>
        <input type="file" id="document" name="document"><br><br>

        <label for="address">Address / Additional Information:</label><br>
        <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your address or any additional info"></textarea><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
