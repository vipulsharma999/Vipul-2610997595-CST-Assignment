<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Menu</title>
</head>
<body>
    <h2>Interactive Restaurant Menu</h2>
    <img src="food.png" alt="foods" width="1000" height="667" usemap="#restaurant-map">

    <map name="restaurant-map">
        <area shape="circle" coords="368,504,97" href="https://en.wikipedia.org/wiki/Pizza" target="_blank" rel="noopener noreferrer" alt="Pizza" title="Pizza">
        <area shape="circle" coords="810,268,65" href="https://en.wikipedia.org/wiki/Hamburger" target="_blank" rel="noopener noreferrer" alt="Burger" title="Burger">
        <area shape="rect" coords="170,290,345,465" href="https://en.wikipedia.org/wiki/French_fries" target="_blank" rel="noopener noreferrer" alt="French Fries" title="French Fries">
        <area shape="rect" coords="710,160,930,440" href="https://en.wikipedia.org/wiki/Menu" target="_blank" rel="noopener noreferrer" alt="Menu Card" title="Menu Card">
        <area shape="poly" coords="2,520,140,545,185,615,105,665,5,665" href="https://en.wikipedia.org/wiki/Sandwich" target="_blank" rel="noopener noreferrer" alt="Sandwich" title="Sandwich">
        <area shape="poly" coords="865,485,930,450,980,540,915,580" href="https://en.wikipedia.org/wiki/Cake" target="_blank" rel="noopener noreferrer" alt="Cake Slice" title="Cake Slice">
        <area shape="default" coords="0,0" href="https://en.wikipedia.org/wiki/Restaurant" target="_blank" rel="noopener noreferrer" alt="Remaining/Other Area" title="Remaining/Other Area">
    </map>
</body>
</html>
