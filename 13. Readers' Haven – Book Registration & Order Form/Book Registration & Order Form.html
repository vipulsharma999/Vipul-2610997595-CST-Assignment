<!DOCTYPE html>
<html>
<head>
    <title>Readers' Haven – Book Registration & Order Form</title>
</head>
<body>

    <h2>Readers' Haven – Book Registration & Order Form</h2>

    <form action="submit_order.html" target="_blank" method="post" enctype="multipart/form-data">

        <input type="hidden" name="order_type" value="Readers Haven Book Order">

        <label for="cname">Customer Name:</label><br>
        <input type="text" id="cname" name="customer_name" placeholder="Enter your full name" required><br><br>

        <label for="cemail">Email Address:</label><br>
        <input type="email" id="cemail" name="customer_email" placeholder="example@email.com" required><br><br>

        <label for="cmobile">Mobile Number:</label><br>
        <input type="tel" id="cmobile" name="customer_mobile" placeholder="10-digit mobile number" required><br><br>

        <label for="cage">Age:</label><br>
        <input type="number" id="cage" name="customer_age" min="1" max="120"><br><br>

        <label for="cpassword">Password:</label><br>
        <input type="password" id="cpassword" name="password" required><br><br>

        <label for="category">Favorite Book Category:</label><br>
        <select id="category" name="book_category" required>
            <option value="">-- Select Category --</option>
            <option value="Fiction">Fiction</option>
            <option value="Science">Science</option>
            <option value="History">History</option>
            <option value="Children's Books">Children's Books</option>
        </select><br><br>

        <label for="title">Book Title:</label><br>
        <input type="text" id="title" name="book_title" placeholder="Enter book title" required><br><br>

        <label for="qty">Quantity:</label><br>
        <input type="number" id="qty" name="quantity" min="1" value="1" required><br><br>

        <label for="ddate">Delivery Date:</label><br>
        <input type="date" id="ddate" name="delivery_date"><br><br>

        <label for="dtime">Preferred Delivery Time:</label><br>
        <input type="time" id="dtime" name="delivery_time"><br><br>

        <label>Preferred Payment Method:</label><br>
        <input type="radio" id="cod" name="payment_method" value="Cash on Delivery" required>
        <label for="cod">Cash on Delivery</label>
        <input type="radio" id="online" name="payment_method" value="Online Payment">
        <label for="online">Online Payment</label><br><br>

        <label>Additional Services:</label><br>
        <input type="checkbox" id="gift" name="services" value="Gift Wrapping">
        <label for="gift">Gift Wrapping</label>
        <input type="checkbox" id="bookmark" name="services" value="Bookmark">
        <label for="bookmark">Bookmark</label>
        <input type="checkbox" id="express" name="services" value="Express Delivery">
        <label for="express">Express Delivery</label>
        <input type="checkbox" id="card" name="services" value="Greeting Card">
        <label for="card">Greeting Card</label><br><br>

        <label for="doc">Upload Reference Document/Image:</label><br>
        <input type="file" id="doc" name="reference_file" accept="image/*,.pdf,.doc,.docx"><br><br>

        <label for="address">Delivery Address:</label><br>
        <textarea id="address" name="delivery_address" rows="3" cols="40" placeholder="Enter full delivery address"></textarea><br><br>

        <label for="instructions">Special Instructions:</label><br>
        <textarea id="instructions" name="special_instructions" rows="3" cols="40" placeholder="Any specific delivery instructions"></textarea><br><br>

        <button type="submit">Place Order</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
